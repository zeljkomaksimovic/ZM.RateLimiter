services:
  zm.ratelimiter.api:
    image: ${DOCKER_REGISTRY-}zmratelimiterapi
    build:
      context: .
      dockerfile: src/ZM.RateLimiter.Api/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      # Single source of truth for the listen port. Do not also set ASPNETCORE_URLS:
      # it takes precedence and would silently override this.
      - ASPNETCORE_HTTP_PORTS=8080
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - proxybackend

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisvolume:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - proxybackend

networks:
  proxybackend:
    name: proxybackend

volumes:
  redisvolume:
